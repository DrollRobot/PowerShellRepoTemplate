# TEMPLATE SETUP NOTES -- remove this block - FIXME
# =============================================================================
# This ci.yml is part of PowershellRepoTemplate, a starter repo scaffold.
#
# Purpose: Runs on every branch push and every pull request. Blocks merges if
# syntax checks or NotLive Pester tests fail. Live tests (tagged 'live') and
# Destructive tests (tagged 'destructive') are intentionally excluded: Live
# needs credentials this runner does not have, and Destructive requires a
# host explicitly marked DISPOSABLE_ENVIRONMENT=1 (never a shared CI runner)
# or a remote target confirmed disposable. Run them separately if needed.
#
# All steps gate: the formatting/lint checks and PSSA exit nonzero on findings,
# and the Pester step exits nonzero on test failures (via Tests.ps1). This is
# the same check set that runs locally in the pre-commit hooks, minus PSSA
# (too slow for a commit hook, so it runs in CI only).
#
# GitHub setup (one-time, to make CI actually block merges):
#   1. Push this file to your repo so the workflow runs at least once.
#   2. Go to Settings -> Branches -> Add branch protection rule.
#   3. Set the pattern to: main
#   4. Enable "Require status checks to pass before merging".
#   5. Search for and add the "check" job (the job name from this file).
#   6. Optionally enable "Require branches to be up to date before merging".
#   7. Save the rule.
#
# Without branch protection, CI will still run and report pass/fail, but
# it will not prevent merging a failing PR.
# =============================================================================

# .github/workflows/ci.yml

name: CI
run-name: CI on ${{ github.ref_name }} ${{ github.event_name }} by @${{ github.actor }}

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan for secrets
        shell: pwsh
        env:
          DETECT_SECRETS_VERSION: 1.5.0
        run: |
          pip install "detect-secrets==$env:DETECT_SECRETS_VERSION"
          detect-secrets-hook --baseline .secrets.baseline @(git ls-files)

      # Install-PSResource (PSResourceGet ships with PowerShell 7.4+) talks to the
      # gallery's newer API, which has been steadier than PowerShellGet 2.x, and
      # the retry loop rides out the gallery's intermittent 5xx responses and
      # failed downloads. A module the runner image already ships at a usable
      # version is not fetched at all.
      - name: Install PowerShell modules
        shell: pwsh
        run: |
          $Required = @(
              @{ Name = 'Pester'; MinimumVersion = '6.0.0' }
              @{ Name = 'PSScriptAnalyzer'; MinimumVersion = '1.0.0' }
              @{ Name = 'ModuleBuilder'; MinimumVersion = '3.0.0' }
          )
          foreach ($Module in $Required) {
              $Have = @(Get-Module -ListAvailable -Name $Module.Name |
                  Where-Object { $_.Version -ge [version]$Module.MinimumVersion } |
                  Sort-Object Version -Descending)
              if ($Have.Count -gt 0) {
                  Write-Host "$($Module.Name) $($Have[0].Version) is preinstalled"
                  continue
              }
              $InstallParams = @{
                  Name            = $Module.Name
                  Version         = "[$($Module.MinimumVersion),)"
                  Scope           = 'CurrentUser'
                  TrustRepository = $true
                  ErrorAction     = 'Stop'
              }
              $Installed = $false
              foreach ($Attempt in 1..5) {
                  try {
                      Install-PSResource @InstallParams
                      $Installed = $true
                      break
                  }
                  catch {
                      Write-Warning ("Attempt $Attempt to install $($Module.Name) failed: " +
                          $_.Exception.Message)
                      Start-Sleep -Seconds (15 * $Attempt)
                  }
              }
              if (-not $Installed) {
                  throw "Could not install $($Module.Name) after 5 attempts"
              }
              $Now = @(Get-Module -ListAvailable -Name $Module.Name | Sort-Object Version -Descending)
              Write-Host "Installed $($Module.Name) $($Now[0].Version)"
          }

      # Importing the module runs Confirm-Dependency.ps1, which aborts the import when
      # any module in RequiredModules.psd1 is missing. Tests.ps1 imports it for every step.
      # Skipped in a child that declined the dependency scripts.
      - name: Install module dependencies
        if: hashFiles('Source/ScriptsToProcess/Install-Dependency.ps1') != ''
        shell: pwsh
        run: .\Source\ScriptsToProcess\Install-Dependency.ps1 -Force

      - name: Lint checks
        shell: pwsh
        run: >
          .\Tests.ps1 ModuleSyntax,Lint -Quiet

      - name: PSScriptAnalyzer
        shell: pwsh
        run: .\Tests.ps1 PSSA -Quiet

      - name: NotLive Pester tests
        shell: pwsh
        run: .\Tests.ps1 NotLive
