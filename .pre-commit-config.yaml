# TEMPLATE SETUP NOTES -- remove this block - FIXME
# =============================================================================
# This .pre-commit-config.yaml is part of PowershellRepoTemplate, a starter
# repo scaffold. pre-commit runs a suite of checks automatically on every
# git commit, catching hygiene issues and accidentally committed secrets
# before they reach the repo.
#
# pre-commit itself is a Python tool (the hooks below are language-agnostic).
# Install it once per machine with pipx, uv, or pip:
#   pipx install pre-commit detect-secrets
#
# First-time setup (run once after cloning):
#   pre-commit install              # install the git hook
#   pre-commit run --all-files      # optional: check existing files now
#   detect-secrets scan > .secrets.baseline   # create the secrets baseline
#
# To keep hook versions current:
#   pre-commit autoupdate           # bump all rev: pins to latest
#
# Hooks included in this config:
#   pre-commit-hooks  -- trailing whitespace, EOF newline, YAML syntax,
#                        large file guard, merge conflict markers
#   detect-secrets    -- prevents secrets from being committed; requires the
#                        .secrets.baseline file created above
#   local             -- the syntax check and the Pester lint checks, both
#                        against staged files only.
# =============================================================================

# .pre-commit-config.yaml

# install
# powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
# curl -LsSf https://astral.sh/uv/install.sh | sh
# uv tool install pre-commit
# pre-commit install
# pre-commit install --hook-type pre-push
# pre-commit autoupdate

# exclude build artifacts
exclude: '^Output/'

default_stages: [pre-commit]

ci:
  autoupdate_schedule: monthly

repos:
  # Generic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # detect-secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # PowerShell lint checks
  - repo: local
    hooks:
      - id: ps-module-syntax
        name: PowerShell syntax
        entry: pwsh -NoProfile -File Tests.ps1 -Test ModuleSyntax -Quiet
        language: system
        files: \.(ps1|psm1|psd1)$

      - id: ps-lint
        name: PowerShell lint
        entry: pwsh -NoProfile -File Tests.ps1 -Test Lint -Quiet
        language: system
        files: \.(ps1|psm1|psd1)$

  # Pre-push checks
  - repo: local
    hooks:
      - id: pester-prepush
        name: pester (prepush)
        entry: pwsh -NoProfile -File Tests.ps1 -Test NotLive -Quiet
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: pssa-prepush
        name: PSScriptAnalyzer (prepush)
        entry: pwsh -NoProfile -File Tests.ps1 -Test PSSA -Quiet
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
